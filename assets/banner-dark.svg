<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 140" width="100%" height="140">
  <defs>
    <!-- Sky Gradient Dark -->
    <linearGradient id="skyGradDark" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0d1117" />
      <stop offset="50%" stop-color="#161b22" />
      <stop offset="100%" stop-color="#1c2d42" />
    </linearGradient>

    <!-- Mountain Gradient 1 (Distant Mist) -->
    <linearGradient id="mountDistantDark" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#2a3f5f" stop-opacity="0.5" />
      <stop offset="100%" stop-color="#161b22" stop-opacity="0.8" />
    </linearGradient>

    <!-- Mountain Gradient 2 (Mid-ground) -->
    <linearGradient id="mountMidDark" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1b2838" />
      <stop offset="100%" stop-color="#0d1117" />
    </linearGradient>

    <!-- Forest Silhouette Gradient -->
    <linearGradient id="forestDark" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0f1923" />
      <stop offset="100%" stop-color="#090d13" />
    </linearGradient>

    <style>
      @keyframes blink {
        0%, 100% { opacity: 1; }
        50% { opacity: 0; }
      }
      .cursor {
        animation: blink 1s infinite;
        fill: #58a6ff;
      }
      .title {
        font-family: 'Fira Code', ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
        font-weight: 700;
        font-size: 24px;
        fill: #58a6ff;
      }
      .sub {
        font-family: 'Fira Code', ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
        font-weight: 500;
        font-size: 13.5px;
        fill: #7ee787;
      }
      .star {
        fill: #ffffff;
        opacity: 0.6;
      }
    </style>
  </defs>

  <!-- Sky Canvas with Rounded Border -->
  <rect width="520" height="138" fill="url(#skyGradDark)" stroke="#30363d" stroke-width="1" rx="10" />

  <!-- Stars in sky -->
  <circle cx="280" cy="25" r="1" class="star" opacity="0.4" />
  <circle cx="340" cy="18" r="1.2" class="star" opacity="0.6" />
  <circle cx="410" cy="35" r="1" class="star" opacity="0.5" />
  <circle cx="470" cy="22" r="1.5" class="star" opacity="0.7" />
  <circle cx="495" cy="45" r="0.8" class="star" opacity="0.4" />
  <circle cx="380" cy="55" r="1" class="star" opacity="0.3" />

  <!-- Distant Misty Mountain Ridge -->
  <path d="M 210 138 L 260 95 L 310 110 L 380 65 L 435 90 L 485 55 L 520 80 L 520 138 Z" fill="url(#mountDistantDark)" />

  <!-- Mid-ground Mountain Ridge -->
  <path d="M 250 138 L 305 105 L 355 118 L 415 85 L 470 110 L 520 85 L 520 138 Z" fill="url(#mountMidDark)" />

  <!-- Pine Tree Silhouettes (Right foreground) -->
  <g fill="url(#forestDark)">
    <!-- Hills under trees -->
    <path d="M 310 138 Q 420 108, 520 115 L 520 138 Z" />
    <!-- Pine Trees -->
    <polygon points="340,115 336,126 344,126" />
    <polygon points="352,112 347,125 357,125" />
    <polygon points="365,106 360,123 370,123" />
    <polygon points="378,110 373,125 383,125" />
    <polygon points="392,103 386,120 398,120" />
    <polygon points="405,98 399,118 411,118" />
    <polygon points="418,100 412,120 424,120" />
    <polygon points="432,95 425,116 439,116" />
    <polygon points="445,93 438,116 452,116" />
    <polygon points="458,97 452,118 464,118" />
    <polygon points="472,91 465,114 479,114" />
    <polygon points="485,94 478,116 492,116" />
    <polygon points="498,90 491,114 505,114" />
    <polygon points="510,93 503,116 517,116" />
  </g>

  <!-- Left Content Group -->
  <g transform="translate(24, 0)">
    <!-- Title -->
    <text x="0" y="58" class="title">Hi, I'm David</text>

    <!-- Terminal Subtitle -->
    <text x="0" y="94" class="sub">&gt; can't code, just tinkering to stay lazy<tspan class="cursor">_</tspan></text>
  </g>

  <!-- Bottom Accent Line -->
  <line x1="0" y1="139" x2="520" y2="139" stroke="#30363d" stroke-width="1.5" />
</svg>
