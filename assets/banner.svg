<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 200" width="100%" height="200">
  <defs>
    <!-- Background Gradient (Twilight Navy) -->
    <linearGradient id="skyGradDark" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0d1117" />
      <stop offset="50%" stop-color="#161b22" />
      <stop offset="100%" stop-color="#1c2d42" />
    </linearGradient>

    <!-- Mountain Gradient 1 (Distant Mist) -->
    <linearGradient id="mountDistantDark" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#2a3f5f" stop-opacity="0.5" />
      <stop offset="100%" stop-color="#161b22" stop-opacity="0.8" />
    </linearGradient>

    <!-- Mountain Gradient 2 (Mid-ground) -->
    <linearGradient id="mountMidDark" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1b2838" />
      <stop offset="100%" stop-color="#0d1117" />
    </linearGradient>

    <!-- Forest Silhouette Gradient -->
    <linearGradient id="forestDark" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0f1923" />
      <stop offset="100%" stop-color="#090d13" />
    </linearGradient>

    <style>
      @keyframes blink {
        0%, 100% { opacity: 1; }
        50% { opacity: 0; }
      }
      .cursor {
        animation: blink 1s infinite;
        fill: #58a6ff;
      }
      .title {
        font-family: 'Fira Code', ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
        font-weight: 700;
        font-size: 22px;
        fill: #58a6ff;
      }
      .sub {
        font-family: 'Fira Code', ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
        font-weight: 500;
        font-size: 13.5px;
        fill: #7ee787;
      }
      .desc {
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif;
        font-size: 12.5px;
        fill: #c9d1d9;
        font-style: italic;
      }
      .star {
        fill: #ffffff;
        opacity: 0.6;
      }
    </style>
  </defs>

  <!-- Sky Canvas with Rounded Border -->
  <rect width="520" height="198" fill="url(#skyGradDark)" stroke="#30363d" stroke-width="1" rx="10" />

  <!-- Stars in sky -->
  <circle cx="280" cy="30" r="1" class="star" opacity="0.4" />
  <circle cx="340" cy="20" r="1.2" class="star" opacity="0.6" />
  <circle cx="410" cy="40" r="1" class="star" opacity="0.5" />
  <circle cx="470" cy="25" r="1.5" class="star" opacity="0.7" />
  <circle cx="495" cy="55" r="0.8" class="star" opacity="0.4" />
  <circle cx="380" cy="65" r="1" class="star" opacity="0.3" />

  <!-- Distant Misty Mountain Ridge -->
  <path d="M 210 198 L 260 135 L 310 155 L 380 95 L 435 130 L 485 85 L 520 115 L 520 198 Z" fill="url(#mountDistantDark)" />

  <!-- Mid-ground Mountain Ridge -->
  <path d="M 250 198 L 305 150 L 355 170 L 415 125 L 470 160 L 520 120 L 520 198 Z" fill="url(#mountMidDark)" />

  <!-- Pine Tree Silhouettes (Right foreground) -->
  <g fill="url(#forestDark)">
    <!-- Hills under trees -->
    <path d="M 310 198 Q 420 155, 520 165 L 520 198 Z" />
    <!-- Pine Trees -->
    <polygon points="340,165 336,180 344,180" />
    <polygon points="352,160 347,178 357,178" />
    <polygon points="365,152 360,175 370,175" />
    <polygon points="378,158 373,178 383,178" />
    <polygon points="392,148 386,172 398,172" />
    <polygon points="405,142 399,170 411,170" />
    <polygon points="418,145 412,172 424,172" />
    <polygon points="432,138 425,168 439,168" />
    <polygon points="445,135 438,168 452,168" />
    <polygon points="458,140 452,170 464,170" />
    <polygon points="472,132 465,165 479,165" />
    <polygon points="485,136 478,168 492,168" />
    <polygon points="498,130 491,165 505,165" />
    <polygon points="510,135 503,168 517,168" />
  </g>

  <!-- Left Content Group -->
  <g transform="translate(24, 0)">
    <!-- Title -->
    <text x="0" y="52" class="title">Hi, I'm David</text>

    <!-- Terminal Subtitle -->
    <text x="0" y="86" class="sub">&gt; can't code, just tinkering to stay lazy<tspan class="cursor">_</tspan></text>

    <!-- Bio Description -->
    <text x="0" y="128" class="desc">Just an ordinary human who can't really code.</text>
    <text x="0" y="148" class="desc">Tinkering with simple scripts to avoid manual work,</text>
    <text x="0" y="168" class="desc">learning something new along the way.</text>
  </g>

  <!-- Bottom Accent Line -->
  <line x1="0" y1="199" x2="520" y2="199" stroke="#30363d" stroke-width="1.5" />
</svg>
