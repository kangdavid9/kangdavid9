<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 140" width="100%" height="140">
  <defs>
    <!-- Sky Gradient Light -->
    <linearGradient id="skyGradLight" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="50%" stop-color="#f6f8fa" />
      <stop offset="100%" stop-color="#eaf0f6" />
    </linearGradient>

    <!-- Mountain Gradient 1 (Distant Mist Light) -->
    <linearGradient id="mountDistantLight" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#cbd5e1" stop-opacity="0.6" />
      <stop offset="100%" stop-color="#94a3b8" stop-opacity="0.4" />
    </linearGradient>

    <!-- Mountain Gradient 2 (Mid-ground Light) -->
    <linearGradient id="mountMidLight" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#94a3b8" />
      <stop offset="100%" stop-color="#64748b" />
    </linearGradient>

    <!-- Forest Silhouette Gradient Light -->
    <linearGradient id="forestLight" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#475569" />
      <stop offset="100%" stop-color="#334155" />
    </linearGradient>

    <style>
      @keyframes blink {
        0%, 100% { opacity: 1; }
        50% { opacity: 0; }
      }
      .cursor {
        animation: blink 1s infinite;
        fill: #0969da;
      }
      .title {
        font-family: 'Fira Code', ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
        font-weight: 700;
        font-size: 24px;
        fill: #0969da;
      }
      .sub {
        font-family: 'Fira Code', ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
        font-weight: 500;
        font-size: 13.5px;
        fill: #1a7f37;
      }
    </style>
  </defs>

  <!-- Sky Canvas with Rounded Border -->
  <rect width="520" height="138" fill="url(#skyGradLight)" stroke="#d0d7de" stroke-width="1" rx="10" />

  <!-- Distant Misty Mountain Ridge -->
  <path d="M 210 138 L 260 95 L 310 110 L 380 65 L 435 90 L 485 55 L 520 80 L 520 138 Z" fill="url(#mountDistantLight)" />

  <!-- Mid-ground Mountain Ridge -->
  <path d="M 250 138 L 305 105 L 355 118 L 415 85 L 470 110 L 520 85 L 520 138 Z" fill="url(#mountMidLight)" />

  <!-- Pine Tree Silhouettes (Right foreground) -->
  <g fill="url(#forestLight)">
    <!-- Hills under trees -->
    <path d="M 310 138 Q 420 108, 520 115 L 520 138 Z" />
    <!-- Pine Trees -->
    <polygon points="340,115 336,126 344,126" />
    <polygon points="352,112 347,125 357,125" />
    <polygon points="365,106 360,123 370,123" />
    <polygon points="378,110 373,125 383,125" />
    <polygon points="392,103 386,120 398,120" />
    <polygon points="405,98 399,118 411,118" />
    <polygon points="418,100 412,120 424,120" />
    <polygon points="432,95 425,116 439,116" />
    <polygon points="445,93 438,116 452,116" />
    <polygon points="458,97 452,118 464,118" />
    <polygon points="472,91 465,114 479,114" />
    <polygon points="485,94 478,116 492,116" />
    <polygon points="498,90 491,114 505,114" />
    <polygon points="510,93 503,116 517,116" />
  </g>

  <!-- Left Content Group -->
  <g transform="translate(24, 0)">
    <!-- Title -->
    <text x="0" y="58" class="title">Hi, I'm David</text>

    <!-- Terminal Subtitle -->
    <text x="0" y="94" class="sub">&gt; can't code, just tinkering to stay lazy<tspan class="cursor">_</tspan></text>
  </g>

  <!-- Bottom Accent Line -->
  <line x1="0" y1="139" x2="520" y2="139" stroke="#d0d7de" stroke-width="1.5" />
</svg>
