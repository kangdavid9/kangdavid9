<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 850 220" width="100%" height="220">
  <defs>
    <!-- Background Light Gradient -->
    <linearGradient id="bannerBgLight" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="50%" stop-color="#f6f8fa" />
      <stop offset="100%" stop-color="#eef2f6" />
    </linearGradient>

    <!-- Bottom Accent Line Gradient -->
    <linearGradient id="bottomLineLight" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#d0d7de" stop-opacity="0.3" />
      <stop offset="35%" stop-color="#0969da" stop-opacity="0.8" />
      <stop offset="65%" stop-color="#218bff" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#d0d7de" stop-opacity="0.3" />
    </linearGradient>

    <!-- Subtle Wave Decoration -->
    <linearGradient id="waveGradLight" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0969da" stop-opacity="0.03" />
      <stop offset="50%" stop-color="#218bff" stop-opacity="0.06" />
      <stop offset="100%" stop-color="#0969da" stop-opacity="0.02" />
    </linearGradient>

    <style>
      @keyframes blink {
        0%, 100% { opacity: 1; }
        50% { opacity: 0; }
      }
      .cursor {
        animation: blink 1s infinite;
        fill: #0969da;
      }
      .title {
        font-family: 'Fira Code', ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
        font-weight: 700;
        font-size: 28px;
        fill: #0969da;
      }
      .sub {
        font-family: 'Fira Code', ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
        font-weight: 500;
        font-size: 16px;
        fill: #1a7f37;
      }
      .desc {
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif;
        font-size: 14.5px;
        fill: #57606a;
        font-style: italic;
      }
    </style>
  </defs>

  <!-- Canvas Background with border -->
  <rect width="850" height="218" fill="url(#bannerBgLight)" stroke="#d0d7de" stroke-width="1" rx="10" />

  <!-- Subtle Ambient Wave -->
  <path d="M0 60 Q 212.5 120, 425 60 T 850 60 L 850 218 L 0 218 Z" fill="url(#waveGradLight)" />

  <!-- Content Group -->
  <g text-anchor="middle">
    <!-- Main Greeting Title -->
    <text x="425" y="65" class="title">Hi, I'm David</text>

    <!-- Terminal Code Tagline -->
    <text x="425" y="105" class="sub">&gt; can't code, just tinkering to stay lazy<tspan class="cursor">_</tspan></text>

    <!-- Humble Bio -->
    <text x="425" y="152" class="desc">Just an ordinary human who can't really code. Just someone tinkering with simple scripts</text>
    <text x="425" y="176" class="desc">to avoid manual work, learning something new along the way.</text>
  </g>

  <!-- Bottom Enclosing Line -->
  <line x1="0" y1="219" x2="850" y2="219" stroke="url(#bottomLineLight)" stroke-width="2" />
</svg>
