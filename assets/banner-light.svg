<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 200" width="100%" height="200">
  <defs>
    <!-- Background Gradient (Soft Mist Daylight) -->
    <linearGradient id="skyGradLight" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="50%" stop-color="#f6f8fa" />
      <stop offset="100%" stop-color="#eaf0f6" />
    </linearGradient>

    <!-- Mountain Gradient 1 (Distant Mist Light) -->
    <linearGradient id="mountDistantLight" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#cbd5e1" stop-opacity="0.6" />
      <stop offset="100%" stop-color="#94a3b8" stop-opacity="0.4" />
    </linearGradient>

    <!-- Mountain Gradient 2 (Mid-ground Light) -->
    <linearGradient id="mountMidLight" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#94a3b8" />
      <stop offset="100%" stop-color="#64748b" />
    </linearGradient>

    <!-- Forest Silhouette Gradient Light -->
    <linearGradient id="forestLight" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#475569" />
      <stop offset="100%" stop-color="#334155" />
    </linearGradient>

    <style>
      @keyframes blink {
        0%, 100% { opacity: 1; }
        50% { opacity: 0; }
      }
      .cursor {
        animation: blink 1s infinite;
        fill: #0969da;
      }
      .title {
        font-family: 'Fira Code', ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
        font-weight: 700;
        font-size: 22px;
        fill: #0969da;
      }
      .sub {
        font-family: 'Fira Code', ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
        font-weight: 500;
        font-size: 13.5px;
        fill: #1a7f37;
      }
      .desc {
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif;
        font-size: 12.5px;
        fill: #57606a;
        font-style: italic;
      }
    </style>
  </defs>

  <!-- Sky Canvas with Rounded Border -->
  <rect width="520" height="198" fill="url(#skyGradLight)" stroke="#d0d7de" stroke-width="1" rx="10" />

  <!-- Distant Misty Mountain Ridge -->
  <path d="M 210 198 L 260 135 L 310 155 L 380 95 L 435 130 L 485 85 L 520 115 L 520 198 Z" fill="url(#mountDistantLight)" />

  <!-- Mid-ground Mountain Ridge -->
  <path d="M 250 198 L 305 150 L 355 170 L 415 125 L 470 160 L 520 120 L 520 198 Z" fill="url(#mountMidLight)" />

  <!-- Pine Tree Silhouettes (Right foreground) -->
  <g fill="url(#forestLight)">
    <!-- Hills under trees -->
    <path d="M 310 198 Q 420 155, 520 165 L 520 198 Z" />
    <!-- Pine Trees -->
    <polygon points="340,165 336,180 344,180" />
    <polygon points="352,160 347,178 357,178" />
    <polygon points="365,152 360,175 370,175" />
    <polygon points="378,158 373,178 383,178" />
    <polygon points="392,148 386,172 398,172" />
    <polygon points="405,142 399,170 411,170" />
    <polygon points="418,145 412,172 424,172" />
    <polygon points="432,138 425,168 439,168" />
    <polygon points="445,135 438,168 452,168" />
    <polygon points="458,140 452,170 464,170" />
    <polygon points="472,132 465,165 479,165" />
    <polygon points="485,136 478,168 492,168" />
    <polygon points="498,130 491,165 505,165" />
    <polygon points="510,135 503,168 517,168" />
  </g>

  <!-- Left Content Group -->
  <g transform="translate(24, 0)">
    <!-- Title -->
    <text x="0" y="52" class="title">Hi, I'm David</text>

    <!-- Terminal Subtitle -->
    <text x="0" y="86" class="sub">&gt; can't code, just tinkering to stay lazy<tspan class="cursor">_</tspan></text>

    <!-- Bio Description -->
    <text x="0" y="128" class="desc">Just an ordinary human who can't really code.</text>
    <text x="0" y="148" class="desc">Tinkering with simple scripts to avoid manual work,</text>
    <text x="0" y="168" class="desc">learning something new along the way.</text>
  </g>

  <!-- Bottom Accent Line -->
  <line x1="0" y1="199" x2="520" y2="199" stroke="#d0d7de" stroke-width="1.5" />
</svg>
